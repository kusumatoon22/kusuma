<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Card - ชุดกิจกรรมผู้พิทักษ์ข้อมูลส่วนตัว</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700;800&family=Kodchasan:wght@300;400;500;600;700&display=swap">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<style>
  :root{
    --bg:#38C3F2;
    --bg-glow: rgba(255,255,255,.45);
    --bg-glow-2: rgba(255,214,64,.30);
    --panel:#FFFFFF;
    --panel-2:#EAF8FF;
    --panel-edge: rgba(20,80,110,.14);
    --on-bg:#FFFFFF;
    --on-bg-dim: rgba(255,255,255,.92);
    --header-edge: rgba(255,255,255,.55);
    --tile:#FF5A5F;
    --tile-edge:#C23239;
    --tile-ink:#FFFFFF;
    --text:#163449;
    --text-dim:#4C7086;
    --text-faint:#8FAFC0;
    --gold:#FF3D81;
    --gold-deep:#D91766;
    --gold-ink:#FFFFFF;
    --gold-text:#D6295F;
    --teal:#06D6A0;
    --teal-text:#00876B;
    --done:#2FBF71;
    --done-ink:#0A2416;
    --danger:#FF3B5C;
    --danger-ink:#2E0410;
    --danger-text:#C81C3E;
    --ring:#FFD400;
    --backdrop: rgba(10,40,60,.62);
    --radius-tile: 20px;
    --radius-panel: 22px;
    --radius-ctl: 12px;
    --font-display: 'Mali', 'Trebuchet MS', cursive;
    --font-body: 'Kodchasan', 'Noto Sans Thai', 'Leelawadee UI', sans-serif;
  }
  *{ box-sizing: border-box; }
